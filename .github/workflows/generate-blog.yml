name: Generate Trade Intelligence Post

# Runs twice a week — Monday and Thursday at 07:00 UTC (10:00 EAT)
# Also triggerable manually from GitHub Actions UI with an optional topic override.

on:
  schedule:
    - cron: '0 7 * * 1'   # Monday    07:00 UTC = 10:00 EAT
    - cron: '0 7 * * 4'   # Thursday  07:00 UTC = 10:00 EAT
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic override — leave blank for auto-selection from the rotation pool'
        required: false
        default: ''

permissions:
  contents: write   # needed to commit and push blog/posts.json

jobs:
  generate:
    name: Generate and publish blog post
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Dependencies ──────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Generate post ─────────────────────────────────────────────────
      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -n "$TOPIC" ]; then
            echo "Using manual topic override: $TOPIC"
            node scripts/generate-blog-post.js "$TOPIC"
          else
            echo "Auto-selecting topic from rotation pool..."
            node scripts/generate-blog-post.js
          fi

      # ── 5. Commit and push ───────────────────────────────────────────────
      # ── 5. Build static post pages + sitemap ─────────────────────────────
      - name: Build static blog pages
        run: npm run build

      # ── 6. Commit and push ───────────────────────────────────────────────
      - name: Commit and push changes
        run: |
          git config --global user.name  "AfriTrade Blog Bot"
          git config --global user.email "bot@afritrade.africa"

          # Stage data, generated pages, and sitemap
          git add blog/posts.json blog/*.html sitemap.xml

          if git diff --staged --quiet; then
            echo "No changes detected — skipping commit."
          else
            TITLE=$(node -e "
              const d = JSON.parse(require('fs').readFileSync('blog/posts.json','utf8'));
              console.log(d.posts[0].title.slice(0, 72));
            ")
            git commit -m "blog: ${TITLE}"
            git push
            echo "Post committed and pushed."
          fi
